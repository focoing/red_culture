# 武汉红色文化导览小助手 - 一键容器化部署
# 用法：
#   1. 在宿主机环境变量或 backend/.env 中配置 ZHIPU_API_KEY（https://open.bigmodel.cn 申请）
#   2. docker compose up -d --build
services:
  # ---------- FastAPI 后端 ----------
  backend:
    build: ./backend
    container_name: red-culture-backend
    restart: unless-stopped
    environment:
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LLM_MODEL: glm-4.7-flash
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      APP_PORT: 8000
    volumes:
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"

  # ---------- Vue 前端（Nginx） ----------
  frontend:
    build: ./frontend
    container_name: red-culture-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  chroma_data:
